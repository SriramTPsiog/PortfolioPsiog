
name: Validate HTML & CSS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate HTML
        run: npx htmlhint index.html --config .htmlhintrc

      - name: Validate CSS
        run: npx stylelint "css/**/*.css"
